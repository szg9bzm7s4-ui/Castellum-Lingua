<style>
:root{
  --bg:#F5F7FC; --surface:#FFFFFF; --surface-2:#E9EDF7; --ink:#13224F; --ink-2:#5A6690; --line:#DCE2F0;
  --accent:#2F5BD8; --accent-dark:#1F43A8; --accent-soft:#E2E9FF; --accent-ink:#FFFFFF;
  --gold:#E0A21B; --gold-dark:#B37F0C; --gold-soft:#FCF0D2;
  --good:#3BAE55; --good-dark:#2A8A41; --good-soft:#DDF5E3; --good-ink:#1F6E33;
  --bad:#E0485C; --bad-dark:#B32F42; --bad-soft:#FDE3E6; --bad-ink:#A12538;
  --locked:#D5DBEA; --locked-dark:#B8C0D6;
  --display:"DM Serif Display",Georgia,"Times New Roman",serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif,"Noto Sans Tifinagh","Noto Sans Egyptian Hieroglyphs","Noto Sans Cuneiform","Noto Sans Imperial Aramaic";
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0D1430; --surface:#152046; --surface-2:#1E2B5A; --ink:#EEF2FF; --ink-2:#A5B0D6; --line:#2A3868;
  --accent:#5B83FF; --accent-dark:#3B5FD0; --accent-soft:#22306A; --accent-ink:#FFFFFF;
  --gold:#F2B83A; --gold-dark:#B98614; --gold-soft:#3A3120;
  --good:#4CC76A; --good-dark:#2F9A4A; --good-soft:#173D27; --good-ink:#8FE5A5;
  --bad:#FF6B7D; --bad-dark:#C8465A; --bad-soft:#45202A; --bad-ink:#FFA3AF;
  --locked:#2A3868; --locked-dark:#1C2750;}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0D1430; --surface:#152046; --surface-2:#1E2B5A; --ink:#EEF2FF; --ink-2:#A5B0D6; --line:#2A3868;
  --accent:#5B83FF; --accent-dark:#3B5FD0; --accent-soft:#22306A; --accent-ink:#FFFFFF;
  --gold:#F2B83A; --gold-dark:#B98614; --gold-soft:#3A3120;
  --good:#4CC76A; --good-dark:#2F9A4A; --good-soft:#173D27; --good-ink:#8FE5A5;
  --bad:#FF6B7D; --bad-dark:#C8465A; --bad-soft:#45202A; --bad-ink:#FFA3AF;
  --locked:#2A3868; --locked-dark:#1C2750;}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;font-variant-numeric:tabular-nums;font-weight:700;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;-webkit-user-select:none;user-select:none}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance;letter-spacing:.005em}
h1{font-size:clamp(1.7rem,4.5vw,2.3rem);line-height:1.12}
h2{font-size:1.4rem;line-height:1.15}
h3{font-size:1.1rem}
p{margin:0}
.eyebrow{font-size:.74rem;font-weight:900;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.muted{color:var(--ink-2);font-weight:600}

/* ---------- mascotte ---------- */
.mascot{display:block;overflow:visible}
.mascot .m-all{transform-origin:100px 210px;transform-box:view-box;animation:bob 3.2s ease-in-out infinite}
.mascot .m-eye{transform-box:fill-box;transform-origin:center;animation:blink 4.6s infinite}
.mascot .m-flag{transform-box:fill-box;transform-origin:left center;animation:wave 1.6s ease-in-out infinite}
.mascot .m-grin,.mascot .m-frown,.mascot .m-sadbrow{display:none}
.mascot[data-mood="happy"] .m-all{animation:hop .55s cubic-bezier(.3,1.6,.5,1) 2}
.mascot[data-mood="happy"] .m-smile{display:none}
.mascot[data-mood="happy"] .m-grin{display:inline}
.mascot[data-mood="sad"] .m-all{animation:droop .5s ease-out forwards}
.mascot[data-mood="sad"] .m-smile,.mascot[data-mood="sad"] .m-brow{display:none}
.mascot[data-mood="sad"] .m-frown,.mascot[data-mood="sad"] .m-sadbrow{display:inline}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.1)}}
@keyframes wave{0%,100%{transform:skewY(0)}50%{transform:skewY(-8deg)}}
@keyframes hop{0%{transform:translateY(0) scale(1)}40%{transform:translateY(-18px) scale(1.03,.97)}100%{transform:translateY(0)}}
@keyframes droop{to{transform:translateY(4px) rotate(-3deg)}}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:250px minmax(0,1fr) 330px;min-height:100%}
.side{position:sticky;top:0;height:100vh;padding:18px 14px;border-right:2px solid var(--line);display:flex;flex-direction:column;gap:14px;background:var(--bg)}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 8px}
.brand img{width:48px;height:48px;border-radius:14px;object-fit:cover;border:2px solid var(--line)}
.brand b{font-family:var(--display);font-weight:400;font-size:1.25rem;line-height:1;color:var(--ink)}
.brand b span{display:block;color:var(--gold);font-size:1rem}
.nav{display:flex;flex-direction:column;gap:4px}
.nav button{display:flex;align-items:center;gap:14px;border:2px solid transparent;background:none;padding:10px 14px;border-radius:14px;text-align:left;font-weight:800;color:var(--ink-2);letter-spacing:.04em;text-transform:uppercase;font-size:.86rem}
.nav button:hover{background:var(--surface-2)}
.nav button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav svg{width:24px;height:24px;flex:none}
.main{min-width:0;padding-inline:16px;padding-block:18px 120px}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.wrap.wide{max-width:900px}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.stats-row{display:flex;align-items:center;gap:6px;justify-content:space-between}
.stat-chip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:12px;font-weight:900;font-size:1rem;border:0;background:none}
.stat-chip:hover{background:var(--surface-2)}
.stat-chip svg{width:24px;height:24px}
.c-fire{color:#F08A24}.c-xp{color:var(--gold)}.c-heart{color:var(--bad)}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:18px}
.topbar{display:none}
.bottom{display:none}
@media (max-width:1180px){.app{grid-template-columns:230px minmax(0,1fr)}.rail{display:none}.topbar{display:flex}}
@media (max-width:780px){
  .app{grid-template-columns:1fr}.side{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:2px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom button{border:2px solid transparent;background:none;display:grid;place-items:center;padding:8px 10px;border-radius:14px;color:var(--ink-2)}
  .bottom button span{display:none}
  .bottom button[aria-current="page"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .bottom svg{width:26px;height:26px}
  .main{padding-block:10px 110px}
}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;background:var(--bg);padding-block:8px;align-items:center;justify-content:space-between;gap:6px;border-bottom:2px solid var(--line);margin-inline:-16px;padding-inline:12px}
.course-chip{display:inline-flex;align-items:center;gap:8px;border:0;background:none;padding:4px 8px;border-radius:12px;font-weight:900}
.course-chip:hover{background:var(--surface-2)}

/* ---------- boutons 3D ---------- */
.btn{--c:var(--accent);--d:var(--accent-dark);--t:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:16px;padding:13px 22px;font-weight:900;letter-spacing:.05em;text-transform:uppercase;font-size:.92rem;background:var(--c);color:var(--t);box-shadow:0 4px 0 var(--d);transition:transform .06s,box-shadow .06s,filter .15s}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--d)}
.btn.good{--c:var(--good);--d:var(--good-dark);--t:#fff}
.btn.bad{--c:var(--bad);--d:var(--bad-dark);--t:#fff}
.btn.gold{--c:var(--gold);--d:var(--gold-dark);--t:#fff}
.btn.ghost{--c:var(--surface);--d:var(--line);--t:var(--accent);border:2px solid var(--line)}
.btn.block{width:100%}
.btn[disabled]{--c:var(--locked);--d:var(--locked-dark);--t:var(--ink-2);cursor:default;filter:none}
.btn[disabled]:active{transform:none;box-shadow:0 4px 0 var(--d)}
.btn.sm{padding:9px 14px;font-size:.8rem;border-radius:12px}
.icon-btn{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:7px 11px;font-weight:800;font-size:.88rem;display:inline-flex;gap:6px;align-items:center;box-shadow:0 2px 0 var(--line)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.icon-btn.on{background:var(--gold-soft);color:var(--gold-dark);border-color:var(--gold)}
.icon-btn svg{width:18px;height:18px}

/* ---------- parcours ---------- */
.unit{display:flex;flex-direction:column;gap:14px}
.unit-head{--h:220;display:flex;align-items:center;gap:12px;justify-content:space-between;background:hsl(var(--h) 62% 46%);color:#fff;border-radius:18px;padding:16px 18px;box-shadow:0 4px 0 hsl(var(--h) 62% 34%)}
.unit-head .eyebrow{color:rgba(255,255,255,.8)}
.unit-head h2{color:#fff}
.unit-head p{font-weight:700;opacity:.92;font-size:.92rem}
.unit-head .guide{border:2px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:14px;padding:9px 12px;font-weight:900;font-size:.78rem;letter-spacing:.06em;text-transform:uppercase;display:inline-flex;gap:6px;align-items:center;flex:none}
.unit-head .guide:hover{background:rgba(255,255,255,.22)}
.unit.locked .unit-head{filter:saturate(.25) brightness(1.05);opacity:.75}
.nodes{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px;padding:14px 0 18px}
.node-wrap{position:relative;display:flex;justify-content:center}
.node{--c:hsl(var(--h) 62% 50%);--d:hsl(var(--h) 62% 36%);width:74px;height:68px;border-radius:50%;border:0;background:var(--c);box-shadow:0 7px 0 var(--d);display:grid;place-items:center;color:#fff;transition:transform .08s,box-shadow .08s;position:relative}
.node svg{width:34px;height:34px}
.node:active{transform:translateY(6px);box-shadow:0 1px 0 var(--d)}
.node.done{--c:var(--gold);--d:var(--gold-dark)}
.node.locked{--c:var(--locked);--d:var(--locked-dark);color:var(--ink-2)}
.node.cp{width:84px;height:78px;border-radius:26px}
.node-wrap.current::before{content:"";position:absolute;inset:-10px;border-radius:50%;border:6px solid color-mix(in srgb,var(--c,var(--accent)) 30%,transparent);border-color:hsl(var(--h) 62% 50% / .28);animation:ring 1.8s ease-out infinite}
@keyframes ring{0%{transform:scale(.92);opacity:1}100%{transform:scale(1.12);opacity:0}}
.start-tip{position:absolute;bottom:calc(100% + 12px);left:50%;transform:translateX(-50%);background:var(--surface);border:2px solid var(--line);color:hsl(var(--h) 62% 44%);padding:7px 12px;border-radius:12px;font-weight:900;letter-spacing:.06em;font-size:.8rem;white-space:nowrap;animation:float 1.6s ease-in-out infinite;pointer-events:none}
.start-tip::after{content:"";position:absolute;top:100%;left:50%;margin-left:-7px;border:7px solid transparent;border-top-color:var(--line)}
@keyframes float{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-5px)}}
.path-mascot{position:absolute;top:50%;transform:translateY(-50%);width:130px;pointer-events:none}
@media (max-width:500px){.path-mascot{width:96px}}
.unit-sep{display:flex;align-items:center;gap:12px;color:var(--ink-2);font-weight:800;font-size:.9rem}
.unit-sep::before,.unit-sep::after{content:"";flex:1;height:2px;background:var(--line)}

/* ---------- panneaux latéraux ---------- */
.quest{display:flex;gap:12px;align-items:center;padding:10px 0}
.quest+.quest{border-top:2px solid var(--line)}
.quest .ic{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none;background:var(--gold-soft);color:var(--gold-dark)}
.quest .ic svg{width:24px;height:24px}
.quest .q{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:.92rem}
.qbar{height:14px;border-radius:999px;background:var(--surface-2);overflow:hidden;position:relative}
.qbar>i{position:absolute;inset:0 auto 0 0;background:var(--gold);border-radius:999px;transition:width .4s}
.qbar>small{position:relative;display:block;text-align:center;font-size:.68rem;line-height:14px;font-weight:900;color:var(--ink)}
.logo-card{display:flex;gap:14px;align-items:center}
.logo-card img{width:84px;height:84px;border-radius:18px;object-fit:cover;flex:none}

/* ---------- leçon ---------- */
.lx{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.lx-top{display:flex;align-items:center;gap:14px;max-width:1000px;width:100%;margin:0 auto;padding:18px 16px 8px}
.lx-top .x{border:0;background:none;color:var(--ink-2);padding:6px;border-radius:10px;display:grid}
.lx-top .x svg{width:26px;height:26px}
.bar{flex:1;height:16px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.bar>div{height:100%;background:var(--good);border-radius:999px;transition:width .45s cubic-bezier(.3,1.3,.5,1);position:relative}
.bar>div::after{content:"";position:absolute;left:8px;right:8px;top:4px;height:4px;border-radius:9px;background:rgba(255,255,255,.35)}
.hearts{display:flex;align-items:center;gap:5px;font-weight:900;color:var(--bad);font-size:1.05rem}
.hearts svg{width:26px;height:26px}
.hearts.hit{animation:shake .4s}
.combo{font-weight:900;color:#F08A24;font-size:.9rem;min-width:52px;text-align:right}
.lx-body{flex:1;overflow-y:auto;padding:12px 16px 24px}
.lx-inner{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:20px;animation:slidein .32s cubic-bezier(.2,.9,.3,1)}
@keyframes slidein{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
.lx-foot{border-top:2px solid var(--line);padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--bg);transition:background .2s}
.lx-foot.good{background:var(--good-soft);border-color:transparent}
.lx-foot.bad{background:var(--bad-soft);border-color:transparent}
.foot-in{max-width:1000px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.foot-msg{display:flex;align-items:center;gap:14px;animation:up .25s ease-out}
.foot-msg .badge{width:56px;height:56px;border-radius:50%;background:var(--surface);display:grid;place-items:center;flex:none}
.foot-msg .badge svg{width:30px;height:30px}
.lx-foot.good .foot-msg{color:var(--good-ink)}.lx-foot.good .badge{color:var(--good)}
.lx-foot.bad .foot-msg{color:var(--bad-ink)}.lx-foot.bad .badge{color:var(--bad)}
.foot-msg b{font-size:1.3rem;display:block;font-weight:900}
.foot-msg span{font-weight:700}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (max-width:600px){.foot-in .btn{width:100%}.foot-msg{width:100%}}
.q-title{font-family:var(--body);font-weight:900;font-size:1.45rem;line-height:1.25}
.speaker{display:flex;align-items:flex-end;gap:10px}
.speaker .mascot{width:104px;flex:none}
.bubble{position:relative;border:2px solid var(--line);border-radius:18px;padding:14px 16px;font-size:1.15rem;background:var(--surface);flex:1;min-width:0;margin-bottom:34px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bubble::before{content:"";position:absolute;left:-13px;bottom:18px;border:7px solid transparent;border-right:7px solid var(--line);border-right-width:12px}
.say{border:0;background:var(--accent);color:#fff;border-radius:12px;width:40px;height:40px;display:grid;place-items:center;flex:none;box-shadow:0 3px 0 var(--accent-dark)}
.say svg{width:22px;height:22px}
.say:active{transform:translateY(3px);box-shadow:none}
.opts{display:grid;gap:12px}
.opts.two{grid-template-columns:1fr 1fr}
@media (max-width:520px){.opts.two{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:14px;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:16px;padding:14px 16px;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 var(--line);transition:transform .06s}
.opt kbd{font-family:var(--body);font-size:.78rem;border:2px solid var(--line);border-radius:8px;min-width:28px;height:28px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.opt:hover:not([disabled]){background:var(--surface-2)}
.opt:active:not([disabled]){transform:translateY(3px);box-shadow:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);box-shadow:0 3px 0 var(--accent)}
.opt.sel kbd{border-color:var(--accent);color:var(--accent)}
.opt.right{border-color:var(--good);background:var(--good-soft);color:var(--good-ink);box-shadow:0 3px 0 var(--good)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad-ink);box-shadow:0 3px 0 var(--bad);animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.intro{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px}

<style id="castellum-affiche">
/* Thème « Affiche » : gros titres, contours épais, aplats de couleur, ombres franches.
   Dernière feuille de style de la page : elle redéfinit les couleurs de base puis les composants. */
:root{
  --bg:#F7F4EE; --surface:#FFFFFF; --surface-2:#EFEAE0; --ink:#111111; --ink-2:#4A4A4A; --line:#111111;
  --accent:#E4472B; --accent-dark:#111111; --accent-soft:#FBD9D2; --accent-ink:#111111;
  --gold:#F7C948; --gold-dark:#111111; --gold-soft:#FDF1C7;
  --good:#3DBE95; --good-dark:#111111; --good-soft:#BFE3D0; --good-ink:#0E3B2F;
  --bad:#F0586C; --bad-dark:#111111; --bad-soft:#FBD0D5; --bad-ink:#7A0E1C;
  --locked:#E3DED3; --locked-dark:#B9B2A4;
  --display:"Archivo Black","Arial Black",Impact,sans-serif;
  --body:"Archivo",system-ui,-apple-system,"Segoe UI",sans-serif,"Noto Sans Tifinagh","Noto Sans Egyptian Hieroglyphs","Noto Sans Cuneiform","Noto Sans Imperial Aramaic";
  --af-edge:#111111; --af-on:#111111; --af-navbg:#111111; --af-navfg:#F7F4EE;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141414; --surface:#1F1F1F; --surface-2:#2B2B2B; --ink:#F7F4EE; --ink-2:#C9C4BA; --line:#8A857B;
  --accent:#E4472B; --accent-dark:#F7F4EE; --accent-soft:#4A1F17; --accent-ink:#111111;
  --gold:#F7C948; --gold-dark:#F7F4EE; --gold-soft:#3A3115;
  --good:#3DBE95; --good-dark:#F7F4EE; --good-soft:#16372E; --good-ink:#9FE8CF;
  --bad:#F0586C; --bad-dark:#F7F4EE; --bad-soft:#47191F; --bad-ink:#FFB3BB;
  --locked:#2B2B2B; --locked-dark:#3A3A3A;
  --af-edge:#F7F4EE; --af-navbg:#000000; --af-navfg:#F7F4EE;}}
:root[data-theme="dark"]{
  --bg:#141414; --surface:#1F1F1F; --surface-2:#2B2B2B; --ink:#F7F4EE; --ink-2:#C9C4BA; --line:#8A857B;
  --accent:#E4472B; --accent-dark:#F7F4EE; --accent-soft:#4A1F17; --accent-ink:#111111;
  --gold:#F7C948; --gold-dark:#F7F4EE; --gold-soft:#3A3115;
  --good:#3DBE95; --good-dark:#F7F4EE; --good-soft:#16372E; --good-ink:#9FE8CF;
  --bad:#F0586C; --bad-dark:#F7F4EE; --bad-soft:#47191F; --bad-ink:#FFB3BB;
  --locked:#2B2B2B; --locked-dark:#3A3A3A;
  --af-edge:#F7F4EE; --af-navbg:#000000; --af-navfg:#F7F4EE;}

body{font-family:var(--body);background:var(--bg);color:var(--ink)}
h1,h2,.cs-h2,.vl-trail-h,.section-head h1,.sheet h2{font-family:var(--display)!important;font-weight:400!important;text-transform:uppercase;letter-spacing:-.015em;line-height:1}
.eyebrow,.vl-eyebrow{font-weight:800;letter-spacing:.08em}

/* Boutons */
.btn{border:2.5px solid var(--af-edge)!important;border-radius:14px!important;box-shadow:4px 4px 0 var(--af-edge)!important;text-transform:uppercase;font-family:var(--display);font-weight:400;letter-spacing:0;color:var(--af-on)}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 var(--af-edge)!important}
.btn.ghost{background:var(--surface)!important;color:var(--ink)!important}
.btn.good{background:var(--good)!important;color:#111!important}
.btn.bad{background:var(--bad)!important;color:#111!important}
.btn.gold{background:var(--gold)!important;color:#111!important}
.btn[disabled]{box-shadow:none!important;opacity:.55}

/* Pastilles du haut */
.stat-chip{border:2.5px solid var(--af-edge)!important;border-radius:12px!important;background:var(--surface)!important;color:var(--ink)!important;font-weight:800;box-shadow:none!important}
.stat-chip.c-fire{background:var(--gold)!important;color:#111!important}
.stat-chip.acc-chip{box-shadow:3px 3px 0 var(--af-edge)!important}

/* Navigation */
#bottomNav.bottom{background:var(--af-navbg)!important;border-top:2.5px solid var(--af-edge)!important}
#bottomNav.bottom button{color:var(--af-navfg)!important;text-transform:uppercase;font-weight:800;font-size:.68rem;border-radius:12px;background:transparent!important;border:0!important}
#bottomNav.bottom button[aria-current="page"]{background:var(--gold)!important;color:#111!important}
.side .nav button{border-radius:12px!important;text-transform:uppercase;font-weight:800}
.side .nav button[aria-current="page"]{background:var(--gold)!important;color:#111!important;border:2.5px solid var(--af-edge)!important;box-shadow:3px 3px 0 var(--af-edge)}

/* Cartes */
.card,.cs-card,.cs-world,.cs-event,.u2-sx,.ac-entry,.mode,.rt-test,.checkpoint,.u2-tool,.vl-sx,.vl-q,.cs-stats>div,.sheet{border:2.5px solid var(--af-edge)!important;border-radius:18px!important;box-shadow:none!important}
.card,.cs-card,.u2-sx,.ac-entry,.rt-test{box-shadow:5px 5px 0 var(--af-edge)!important}
.mode{background:var(--surface)!important;color:var(--ink)!important}
.field select,.field input,input[type="text"],input[type="search"],input[type="email"],input[type="password"],textarea,select{border:2.5px solid var(--af-edge)!important;border-radius:12px!important;background:var(--surface);color:var(--ink)}

/* Niveaux A1 → C2 */
.levels .lvl{border:2.5px solid var(--af-edge)!important;border-radius:12px!important;background:var(--surface)!important;color:var(--ink)!important;font-family:var(--display);font-weight:400;box-shadow:none!important}
.levels .lvl[aria-selected="true"],.levels .lvl.on,.levels .lvl.cur{background:var(--ink)!important;color:var(--bg)!important}

/* Apprendre : la ville */
.vl{--vl-acc:#E4472B;--vl-acc-ink:#111111;--vl-ink:var(--ink);--vl-card:var(--surface);--vl-muted:var(--ink-2)}
